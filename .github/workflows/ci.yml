name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: "6.11.2"
  QT_MODULES: qtserialbus qtserialport qtgraphs qttasktree qtquick3d qtshadertools
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt / OpenGL system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgl1-mesa-dev libfontconfig1-dev libdbus-1-dev \
            libxkbcommon-dev libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            patchelf

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.workspace }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: qt6112-linux

      - name: Configure
        run: |
          PRE="${QT_ROOT_DIR}"
          if [ ! -f "${PRE}/lib/cmake/Qt6Graphs/Qt6GraphsConfig.cmake" ]; then
            PRE="$(dirname "${PRE}")/gcc_64"
          fi
          export PATH="${PRE}/bin:${PATH}"
          "${PRE}/bin/qmake6" -query QT_VERSION
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${PRE}" \
            -DQt6_DIR="${PRE}/lib/cmake/Qt6"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  qmllint:
    # Static analysis for QML: catches missing ComponentBehavior bounds,
    # unknown properties on registered types, signal/payload mismatches,
    # and broken imports. Runs against the same Debug build the test job
    # produces so it sees the same QML module output directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # OpenGL libs are needed because Qt6Gui / Qt6Quick fail to find their
      # WrapOpenGL dependency on a bare runner; qmllint itself doesn't
      # actually link against OpenGL but the CMake configure step does.
      - name: Install OpenGL system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1 libgl1 libglib2.0-0 \
            libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.workspace }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: qt6112-linux

      - name: Configure
        run: |
          PRE="${QT_ROOT_DIR}"
          if [ ! -f "${PRE}/lib/cmake/Qt6Graphs/Qt6GraphsConfig.cmake" ]; then
            PRE="$(dirname "${PRE}")/gcc_64"
          fi
          export PATH="${PRE}/bin:${PATH}"
          cmake -B build-qml -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${PRE}" \
            -DQt6_DIR="${PRE}/lib/cmake/Qt6"

      - name: qmllint
        run: cmake --build build-qml --target qmllint

      # Surface qmllint warnings as a job summary so reviewers can spot them
      # in the PR checks UI without re-running the build locally.
      - name: Summary
        if: always()
        run: |
          {
            echo "### qmllint"
            echo "Aggregated lint target status: ${{ steps.qmllint.outcome == 'success' && '✓ clean' || '✗ warnings/errors — see job log' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer in Debug. Catches
    # buffer overruns, use-after-free, integer overflow, alignment bugs,
    # and leaks at runtime — a class of issues static analysis misses.
    # Only runs against the in-tree unit tests (no GUI app — QPA offscreen
    # is unnecessary because tests don't open windows).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # OpenGL libs required for the CMake configure step to find
      # Qt6Gui / Qt6Quick's WrapOpenGL dependency on a bare runner.
      - name: Install OpenGL system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1 libgl1 libglib2.0-0 \
            libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.workspace }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: qt6112-linux

      - name: Configure
        env:
          # ASan + UBSan instrumentation. -fno-omit-frame-pointer keeps stack
          # traces usable in ASan reports; -O1 keeps the runtime overhead
          # manageable on a free CI runner.
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -O1
          LDFLAGS:  -fsanitize=address,undefined
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
        run: |
          PRE="${QT_ROOT_DIR}"
          if [ ! -f "${PRE}/lib/cmake/Qt6Graphs/Qt6GraphsConfig.cmake" ]; then
            PRE="$(dirname "${PRE}")/gcc_64"
          fi
          export PATH="${PRE}/bin:${PATH}"
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${PRE}" \
            -DQt6_DIR="${PRE}/lib/cmake/Qt6"

      - name: Build (sanitizers)
        run: cmake --build build-asan -j"$(nproc)"

      - name: Test (sanitizers)
        env:
          QT_QPA_PLATFORM: offscreen
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
        run: ctest --test-dir build-asan --output-on-failure
